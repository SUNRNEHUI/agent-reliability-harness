name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      # actions/checkout@v7 (verified refs/tags/v7: 3d3c42e5aac5ba805825da76410c181273ba90b1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      # actions/setup-python@v7 (verified refs/tags/v7: 5fda3b95a4ea91299a34e894583c3862153e4b97)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: >-
          python -m compileall -q
          scripts
          skills/agent-harness/scripts
          tests
      - name: Run unit and behavior tests
        run: python -m unittest discover -s tests -v
      - name: Run packaged runtime checks
        run: python tests/test_runtime_behavior.py
      - name: Run adversarial protocol checks
        run: >-
          python tests/protocol_regression_harness.py
          --skill-root skills/agent-harness
          --pretty
      - name: Verify canonical Skill package
        run: python scripts/package_skill.py --verify-source
      - name: Schema contract smoke
        run: python scripts/schema_smoke.py
      - name: Package build and check smoke
        run: >-
          python scripts/package_skill.py
          --output "${{ runner.temp }}/agent-harness-runtime"
          --force
          && python scripts/package_skill.py
          --check "${{ runner.temp }}/agent-harness-runtime"
      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD

  discovery:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7 (verified refs/tags/v7: 3d3c42e5aac5ba805825da76410c181273ba90b1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      # actions/setup-node@v7 (verified refs/tags/v7: 820762786026740c76f36085b0efc47a31fe5020)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Validate cross-agent Skill discovery
        run: npx --yes skills@1.5.23 add . --list
