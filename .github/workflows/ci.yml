name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: >-
          python -m compileall -q
          scripts
          skills/agent-reliability-harness/scripts
          tests
      - name: Run unit and behavior tests
        run: python -m unittest discover -s tests -v
      - name: Run packaged runtime checks
        run: python tests/test_runtime_behavior.py
      - name: Run adversarial protocol checks
        run: >-
          python tests/protocol_regression_harness.py
          --skill-root skills/agent-reliability-harness
          --pretty
      - name: Verify canonical Skill package
        run: python scripts/package_skill.py --verify-source

  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate cross-agent Skill discovery
        run: npx --yes skills@1.5.23 add . --list
