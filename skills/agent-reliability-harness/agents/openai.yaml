interface:
  display_name: "Agent Reliability Harness"
  short_description: "Progress-bounded execution with durable evidence"
  default_prompt: "Use $agent-reliability-harness as the parent manager: choose Native, Portable, or Audited for persistence/evidence depth; parent/main uses gpt-5.6-sol high. A confirmed v3 micro implementation with six explicit route assertions may stay parent-direct when delegation costs more; explicit user delegation selects one bounded luna_worker on gpt-5.6-luna max when configured, and ordinary/heavy implementation uses that worker by default. Parallelize only independent complex modules; keep coupled writes serial or single-owner; retain goal, short plan, dispatch, status, integration, and acceptance. Workers do not recurse. Try another verifiable bounded worker before blocking; parent direct fallback requires explicit user authorization and no route may be claimed without evidence."
